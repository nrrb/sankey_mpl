[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sankey_mpl"
description = "Sankey diagrams for matplotlib, as clean vector output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["sankey", "matplotlib", "diagram", "flow", "visualization", "svg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Matplotlib",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.22",
]
dynamic = ["version"]

[[project.authors]]
name = "Nicholas Bennett"

[project.urls]
Homepage = "https://github.com/nrrb/sankey_mpl"
Documentation = "https://github.com/nrrb/sankey_mpl/blob/main/docs/usage.md"
Issues = "https://github.com/nrrb/sankey_mpl/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.version]
path = "src/sankey_mpl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sankey_mpl"]

[tool.hatch.build.targets.sdist]
# This list is the *source release* only, and says nothing about what gets installed.
# The wheel target above ships `src/sankey_mpl` and nothing else, so neither `tools`
# nor `tests` ever lands in site-packages however the project is installed: pip builds
# the same wheel whether it starts from the sdist or not. They travel with the source
# for reproducibility, not for use at runtime.
#
# The generators are worth shipping so the goldens and the gallery stay reproducible
# from a source release; goldens nobody can rebuild are unverifiable blobs. `tools` is
# included wholesale rather than by glob: the previous `tools/*.mjs` + `tools/*.json`
# pair silently stopped covering the dataset specs when they moved into
# `tools/datasets/`, which shipped the generator with none of its inputs. A directory
# cannot drift out of date that way.
#
# node_modules is fetched, not authored. examples/ is regenerable output and would
# add several megabytes to every release for no benefit.
include = [
  "src",
  "tests",
  "tools",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
]
exclude = [
  "tools/node_modules",
  "tools/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["src/sankey_mpl"]
# matplotlib ships incomplete stubs; this keeps the check about our own code.
ignore_missing_imports = true

[tool.coverage.report]
# Sits below the current figure deliberately. A gate set exactly at today's
# number blocks unrelated work and gets switched off; this one only fires on a
# real regression.
fail_under = 93
show_missing = true

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable assertions over strict style.
"tests/*" = ["E501"]
