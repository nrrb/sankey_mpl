name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is here because it is what development actually happens on. Leaving it
        # out meant the only interpreter anyone ran by hand was the one CI never saw.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # No display on a runner, and the library never needs an interactive one.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The package ships py.typed and claims the Typing :: Typed classifier, so the
      # annotations are a promise to consumers rather than a private convenience.
      # Nothing checked them until this step existed, and they did not pass.
      - run: mypy
      - run: pytest -q --cov=sankey_mpl

  minimums:
    # Every row above installs the newest matplotlib and numpy, so the declared
    # floors in pyproject.toml were an assertion nothing tested. This pins them.
    # If it fails, the floors are wrong and the fix is to raise them, not to relax
    # this job: a dependency range that does not work is worse than a narrow one.
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      # Pinned before the package goes in, then --no-deps so installing it cannot
      # quietly resolve them forward again.
      - run: pip install "matplotlib==3.7.*" "numpy==1.22.*"
      - run: pip install -e . --no-deps
      - run: pip install pytest
      - run: pip list
      - run: pytest -q
