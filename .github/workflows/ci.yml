name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is here because it is what development actually happens on. Leaving it
        # out meant the only interpreter anyone ran by hand was the one CI never saw.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # No display on a runner, and the library never needs an interactive one.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The package ships py.typed and claims the Typing :: Typed classifier, so the
      # annotations are a promise to consumers rather than a private convenience.
      # Nothing checked them until this step existed, and they did not pass.
      - run: mypy
      - run: pytest -q --cov=sankey_mpl

  # publish.yml hands the built distributions between two jobs with upload-artifact and
  # download-artifact, and CI never runs publish.yml, so a bump to either action was
  # untested until the next release actually used it. That is a bad place to find out:
  # the artifact actions require matched versions, their majors are numbered
  # independently, and a mismatch corrupts or loses the files being published.
  #
  # These two jobs exercise the same pair on every push. Keep the versions identical to
  # the ones in publish.yml, which Dependabot does automatically since it updates every
  # workflow in one PR.
  #
  # Checksums rather than a presence check: what matters is that bytes survive the round
  # trip intact, since a corrupted wheel would reach PyPI and could never be replaced.
  # download-artifact v8 errors on a digest mismatch by default, so this also confirms
  # that path stays quiet.
  artifact-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Build a payload with known checksums
        run: |
          mkdir -p payload
          printf 'text canary\n' > payload/canary.txt
          head -c 4096 /dev/urandom > payload/canary.bin
          cd payload && sha256sum canary.txt canary.bin > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: roundtrip
          path: payload/
          retention-days: 1

  artifact-download:
    needs: artifact-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: roundtrip
          path: payload/
      - name: Every byte survived the round trip
        run: |
          ls -l payload
          cd payload && sha256sum -c SHA256SUMS

  minimums:
    # Every row above installs the newest matplotlib and numpy, so the declared
    # floors in pyproject.toml were an assertion nothing tested. This pins them.
    # If it fails, the floors are wrong and the fix is to raise them, not to relax
    # this job: a dependency range that does not work is worse than a narrow one.
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      # Pinned before the package goes in, then --no-deps so installing it cannot
      # quietly resolve them forward again.
      - run: pip install "matplotlib==3.7.*" "numpy==1.22.*"
      - run: pip install -e . --no-deps
      - run: pip install pytest
      - run: pip list
      - run: pytest -q
