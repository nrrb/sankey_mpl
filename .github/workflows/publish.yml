# Publishes to PyPI using trusted publishing (OIDC), so no API token exists anywhere
# in this repository or in its secrets. PyPI verifies the identity of this workflow
# directly, which means there is no upload credential to leak or rotate.
#
# This file is inert until matching publishers are configured. TestPyPI and PyPI are
# entirely separate services: separate accounts, separate project namespaces, separate
# pending publishers. Register on both, and note the environment name differs:
#
#   https://test.pypi.org/manage/account/publishing/   environment: testpypi
#   https://pypi.org/manage/account/publishing/        environment: pypi
#
# Both forms take: project `sankey-mpl`, owner `nrrb`, repository `sankey_mpl`,
# workflow filename `publish.yml`. Owner and repository are the GitHub coordinates,
# unrelated to the PyPI username. The workflow filename must match exactly.
#
# Note on name reservation: a *pending* publisher does not reserve the project name.
# The name is only claimed by the first successful upload, so until then somebody else
# can still take it.
name: publish

on:
  push:
    tags: ["v*"]
  # Run from the Actions tab, selecting a tag as the ref, to publish or rehearse a tag
  # that is already pushed. Dispatching from a branch fails the version check below,
  # which is deliberate, since a release must come from a tag.
  #
  # The tag you select must itself contain this file. GitHub resolves a dispatched
  # workflow on the selected ref, so a tag created before this workflow existed reports
  # "Workflow does not exist or does not have a workflow_dispatch trigger in this tag"
  # and cannot be published this way. Re-cut the tag on a commit that includes this
  # file, or release a newer version.
  #
  # Defaults to TestPyPI, so the cautious path is the one you get by pressing enter.
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The mistake this catches: `[tool.hatch.version]` reads `__version__` out of
      # src/sankey_mpl/__init__.py, so tagging v0.2.0 without bumping that file
      # publishes a wheel labelled 0.1.0. PyPI would accept it and the version number
      # would then be wrong forever, since a released version can never be replaced.
      - name: Tag, __version__ and CHANGELOG must agree
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          ref = os.environ["GITHUB_REF_NAME"]
          tag = ref.removeprefix("v")

          source = pathlib.Path("src/sankey_mpl/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)

          # The newest released heading, skipping [Unreleased], which is not a semver
          # number and so cannot match this pattern.
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          heading = re.search(r"^## \[(\d+\.\d+\.\d+)\]", changelog, re.M)
          documented = heading.group(1) if heading else None

          print(f"ref {ref!r} -> tag {tag!r}")
          print(f"__version__ {version!r}")
          print(f"CHANGELOG   {documented!r}")

          problems = []
          if tag != version:
              problems.append(
                  f"ref {ref!r} does not match __version__ {version!r}. Bump "
                  f"src/sankey_mpl/__init__.py and retag, or dispatch this workflow "
                  f"from a tag rather than a branch."
              )
          if documented != version:
              problems.append(
                  f"CHANGELOG.md's newest release heading is {documented!r} but "
                  f"__version__ is {version!r}. A release with no entry describing it "
                  f"is worse than no release: PyPI versions are permanent, so the "
                  f"record cannot be fixed afterwards. Run "
                  f"`python tools/bump_version.py <major|minor|patch>`, which keeps "
                  f"both in step."
              )
          if problems:
              sys.exit("refusing to publish:\n  " + "\n  ".join(problems))
          PY

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      # Catches metadata that PyPI would reject, before anything is uploaded.
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The rehearsal. Same artifacts, same OIDC path, a throwaway namespace. Worth doing
  # once per project rather than once per release: what it catches is a broken
  # publisher config or unrenderable README metadata, and those are properties of the
  # setup, not of the version. Note TestPyPI burns version numbers just as permanently
  # as PyPI does, so a failed real upload cannot be retried there under the same
  # version.
  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' || inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in Settings -> Environments to make
    # every release wait for a human. Recommended, because a PyPI version is permanent:
    # it can be yanked but never replaced or reused.
    environment: pypi
    permissions:
      # The whole point: this is what lets PyPI verify the workflow's identity. Without
      # it the upload fails with an OIDC error rather than an auth error.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
